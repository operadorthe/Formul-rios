.hero img{max-width:70vw;height:auto}
.wrap{max-width:640px;margin:-36px auto 0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 56px);position:relative}
.card{background:rgba(20,36,24,.72);border:1px solid var(--linha);border-radius:20px;padding:28px 24px;backdrop-filter:blur(10px)}
.f{margin-bottom:22px}.q{display:block;font-weight:500;margin-bottom:8px}.q b{color:var(--laranja);font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--creme);background:rgba(255,250,213,.09);border:1px solid var(--linha);border-radius:12px;padding:12px 14px}
select option{color:#142418;background:#FFFAD5}input::placeholder,textarea::placeholder{color:rgba(255,250,213,.45)}
.op{display:flex;flex-wrap:wrap;gap:8px}.op label{position:relative;cursor:pointer}.op input{position:absolute;opacity:0;width:1px;height:1px}
.op span{display:inline-block;padding:10px 18px;border:1px solid var(--linha);border-radius:999px;background:rgba(255,250,213,.06)}
.op input:checked+span{background:var(--creme);color:var(--mata);border-color:var(--creme);font-weight:600}.op input:focus-visible+span{outline:2px solid var(--laranja);outline-offset:2px}
.btn{font:inherit;font-weight:600;border:1px solid var(--creme);border-radius:999px;padding:13px 28px;background:var(--creme);color:var(--mata);cursor:pointer}
.btn:hover{background:var(--petala)}.btn.sec{background:transparent;color:var(--creme);border-color:var(--linha)}.btn.sec:hover{background:var(--vidro)}.btn.sm{padding:7px 14px;font-size:14px}.btn:disabled{opacity:.45;cursor:default}
.msg{color:var(--erro);margin-top:12px;min-height:1.5em}.msg.ok{color:var(--petala)}.hp{position:absolute;left:-9999px}
.ok{text-align:center;padding:20px 0}.ok img{width:76px;margin-bottom:16px}.ok p{margin:8px 0 22px;color:var(--mudo)}
.lista{display:grid;gap:12px;margin-top:20px}.item{display:block;text-decoration:none;padding:18px 20px;border:1px solid var(--linha);border-radius:16px;background:var(--vidro)}
.item:hover{border-color:var(--laranja)}.item strong{display:block;font:600 1.15rem Fraunces,Georgia,serif}.item span{color:var(--mudo)}
.pe{text-align:center;margin-top:26px;color:var(--mudo);font-size:14px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login .card{width:min(420px,100%);text-align:left}.login img{margin-bottom:22px}.login p{margin-bottom:22px}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--linha);background:rgba(20,36,24,.94);position:sticky;top:0;z-index:5}
.top nav{flex:1;display:flex;gap:4px;overflow-x:auto}.top nav button{background:none;border:0;color:var(--mudo);font:inherit;font-weight:500;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.top nav .on{background:rgba(255,250,213,.12);color:var(--creme)}
.main{max-width:1100px;margin:auto;padding:24px 16px 64px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}.bar select{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi{padding:18px;border:1px solid var(--linha);border-radius:16px;background:var(--vidro)}
.kpi .num{display:block;font-size:2.5rem;margin-bottom:4px}.kpi small{color:var(--mudo);font-size:14px;line-height:1.3;display:block}
.g2c{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:14px 0}.main .card{padding:22px}
.bars{display:flex;align-items:flex-end;gap:6px;height:200px}.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.col small{font-size:12px;color:var(--mudo)}.col i{display:block;width:100%}.col i:first-of-type{border-radius:5px 5px 0 0}
.a{background:var(--laranja)}.c{background:var(--rosa)}.lg{font-size:14px;color:var(--mudo);margin-bottom:10px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 6px 0 10px}.lg i:first-child{margin-left:0}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 40px;gap:10px;align-items:center;margin:10px 0}.hb b{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--laranja),var(--rosa))}.hb em{font-style:normal;text-align:right}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{font:inherit;color:var(--creme);background:none;border:1px solid var(--linha);border-radius:999px;padding:8px 16px;cursor:pointer}.pill.on{background:var(--creme);color:var(--mata);font-weight:600}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px;align-items:center}.filtros input,.filtros select{width:auto;flex:1;min-width:150px}.filtros label{color:var(--mudo);display:flex;gap:8px;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--linha);border-radius:16px}.tb{width:100%;border-collapse:collapse;min-width:560px}.tb th,.tb td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--linha)}
.tb th{font-weight:500;color:var(--mudo);font-size:14px}.tb tr[data-id]{cursor:pointer}.tb tr[data-id]:hover{background:var(--vidro)}.tb tr:last-child td{border-bottom:0}
.bd{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;background:rgba(242,140,75,.2);color:var(--laranja)}.bd.fe{background:rgba(77,113,49,.5);color:var(--creme)}
.vazio{text-align:center;padding:48px 0;color:var(--mudo)}.vazio img{margin-bottom:12px;opacity:.9}
.dr{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:#1b3021;border-left:1px solid var(--linha);padding:24px;overflow:auto;z-index:10}.dr[hidden]{display:none}
.dr h2{margin-top:20px}.dr dt{color:var(--mudo);font-size:14px;margin-top:16px}.dr dd{margin:2px 0 0;font-size:17px;overflow-wrap:anywhere}.dr .acts{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.fr{border:1px solid var(--linha);border-radius:16px;padding:16px;margin:12px 0;background:var(--vidro)}.fr textarea{margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 210px;gap:10px}@media(max-width:560px){.g2{grid-template-columns:1fr}.top{padding:10px 12px}}
.fr .acts{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto}

function abrir(id){const r=resp.find(x=>x.id==id),f=forms.find(x=>x.slug==r.form_slug),L=FS[f.slug]||["Novo","Concluído"];
 const ids=[...new Set([...f.fields.map(x=>x.id),...Object.keys(r.data)])].filter(i=>i in r.data);
 $("#dr").innerHTML='<button class="btn sec sm" id="fx">Fechar</button><h2>'+fdt(r.created_at)+"</h2><p>"+badge(r)+"</p><dl>"+ids.map(i=>{const t=(f.fields.find(x=>x.id==i)||{}).type,v=t=="date"?dd(r.data[i]):val(r.data[i]);return "<dt>"+esc(lab(f,r,i))+"</dt><dd>"+(esc(v)||"—")+"</dd>"}).join("")+'</dl><div class="acts"><button class="btn" id="tg">'+(r.status=="novo"?"Marcar como "+L[1].toLowerCase():"Voltar para "+L[0].toLowerCase())+'</button><button class="btn sec" id="rm">Excluir</button></div>';
 $("#dr").hidden=false;$("#fx").onclick=fechar;
 $("#tg").onclick=async()=>{const s=r.status=="novo"?"feito":"novo",{error}=await sb.from("responses").update({status:s}).eq("id",r.id);if(error)return alert("Não foi possível atualizar. Entre de novo e tente outra vez.");r.status=s;abrir(id);lista()};
 $("#rm").onclick=async()=>{if(!confirm("Excluir esta resposta? Não dá para desfazer."))return;const{error}=await sb.from("responses").delete().eq("id",r.id);if(error)return alert("Não foi possível excluir.");resp=resp.filter(x=>x!==r);fechar();lista()}}
function fechar(){$("#dr").hidden=true}document.addEventListener("keydown",e=>e.key=="Escape"&&fechar());
function csv(){const f=forms.find(x=>x.slug==cx.slug),rs=filtrar(),ids=[...new Set([...f.fields.map(x=>x.id),...rs.flatMap(r=>Object.keys(r.data))])];
 const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',lb=i=>(f.fields.find(x=>x.id==i)||{}).label||(rs.find(r=>r.labels[i])||{labels:{}}).labels[i]||i;
 const rows=[["Recebida em","Situação",...ids.map(lb)],...rs.map(r=>[fdt(r.created_at),stl(r),...ids.map(i=>val(r.data[i]))])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download=f.slug+"-"+new Date().toISOString().slice(0,10)+".csv";a.click()}
function editor(slug){const f=forms.find(x=>x.slug==(slug||ed?.slug))||forms[0];

 $("#main").innerHTML='<div class="bar"><h1>Formulários</h1><button class="btn" id="sv">Salvar alterações</button></div>'+pills(ed.slug)
 +'<section class="card"><div class="f"><label class="q" for="t">Título</label><input id="t" data-h="title" value="'+esc(ed.title)+'"></div><div class="f"><label class="q" for="s">Texto de apresentação</label><input id="s" data-h="subtitle" value="'+esc(ed.subtitle)+'"></div><div class="f"><label class="q" for="o">Mensagem depois do envio</label><input id="o" data-h="success" value="'+esc(ed.success)+'"></div><p class="mu">Link para compartilhar: <a href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(link)+'</a></p></section><h2>Perguntas</h2><div id="fl"></div><button class="btn sec" id="ad">Adicionar pergunta</button><p class="msg" id="info" role="status"></p>';fl()}
const row=(f,i)=>'<div class="fr" data-i="'+i+'"><div class="g2"><input data-k="label" value="'+esc(f.label)+'" aria-label="Texto da pergunta" placeholder="Texto da pergunta"><select data-k="type" aria-label="Tipo de resposta">'+Object.entries(TP).map(([k,v])=>'<option value="'+k+'"'+(k==f.type?" selected":"")+">"+v+"</option>").join("")+"</select></div>"
 +(OPT.includes(f.type)?'<textarea data-k="options" rows="4" aria-label="Opções, uma por linha" placeholder="Uma opção por linha">'+esc((f.options||[]).join("\n"))+"</textarea>":"")

 const r=t.closest(".fr");if(!r||!t.dataset.k)return;const f=ed.fields[+r.dataset.i],k=t.dataset.k;

 else if(k=="type"){f.type=t.value;if(OPT.includes(t.value)&&!(f.options||[]).length)f.options=["Opção 1","Opção 2"];fl()}else f[k]=t.value});
$("#main").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.s){if(tab=="caixa"){cx.slug=b.dataset.s;caixa()}else editor(b.dataset.s);return}
 if(tab!="editor")return;
 if(b.dataset.a){const i=+b.closest(".fr").dataset.i,a=ed.fields;

  else{const j=b.dataset.a=="up"?i-1:i+1;[a[i],a[j]]=[a[j],a[i]]}fl();return}
 if(b.id=="ad"){ed.fields.push({id:"c"+Date.now().toString(36),label:"",type:"text",required:false});fl();const l=$$("#fl [data-k=label]");l[l.length-1].focus();return}
 if(b.id=="sv"){if(ed.fields.some(f=>!f.label.trim()))return info("Toda pergunta precisa de um texto.",1);
  if(ed.fields.some(f=>OPT.includes(f.type)&&!(f.options||[]).length))return info("Escreva ao menos uma opção nas perguntas de escolha.",1);
  const fields=ed.fields.map(f=>({...f,label:f.label.trim()})),{error}=await sb.from("forms").update({title:ed.title,subtitle:ed.subtitle,success:ed.success,fields,updated_at:new Date().toISOString()}).eq("slug",ed.slug);
  if(error)return info("Não foi possível salvar. Entre de novo e tente outra vez.",1);
